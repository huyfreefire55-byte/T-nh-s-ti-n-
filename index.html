<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tính Số Tiền</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; 
        }

        body { 
            background: #F4F6FB; 
            color: #1E293B; 
            padding-bottom: 90px; 
        }

        /* Header Hiện Đại */
        header { 
            background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%); 
            color: white; 
            padding: 18px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.3); 
            position: sticky; 
            top: 0; 
            z-index: 100;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }

        header h1 { 
            font-size: 20px; 
            font-weight: 700; 
            letter-spacing: -0.5px;
        }

        .header-actions button { 
            background: rgba(255, 255, 255, 0.15); 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(8px);
            color: white; 
            font-size: 18px; 
            width: 40px;
            height: 40px;
            border-radius: 12px;
            margin-left: 8px; 
            cursor: pointer; 
            transition: all 0.2s ease;
        }

        .header-actions button:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.3);
        }

        /* Grid Thẻ Mặt Hàng */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 16px; 
            padding: 20px 16px; 
        }

        .card { 
            background: #FFFFFF; 
            border-radius: 20px; 
            padding: 18px 14px; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04); 
            border: 1px solid #E2E8F0;
            text-align: center; 
            cursor: pointer; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
            position: relative; 
        }

        .card:active { 
            transform: scale(0.96); 
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        .card h3 { 
            font-size: 16px; 
            font-weight: 700;
            margin-bottom: 6px; 
            color: #0F172A; 
        }

        .card p { 
            font-size: 13px; 
            color: #6366F1; 
            font-weight: 600; 
            background: #EEF2FF;
            padding: 4px 8px;
            border-radius: 8px;
            display: inline-block;
        }

        .card .btn-delete { 
            position: absolute; 
            top: 8px; 
            right: 10px; 
            color: #94A3B8; 
            font-size: 14px; 
            border: none; 
            background: none; 
            padding: 4px;
            cursor: pointer;
        }

        /* Nút Thêm Mới (FAB) */
        .fab { 
            position: fixed; 
            bottom: 24px; 
            right: 24px; 
            width: 60px; 
            height: 60px; 
            background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%); 
            color: white; 
            border-radius: 20px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 32px; 
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4); 
            border: none; 
            cursor: pointer; 
            transition: transform 0.2s ease;
        }

        .fab:active {
            transform: scale(0.9);
        }

        /* Popup Modal (Glassmorphism) */
        .modal { 
            display: none; 
            position: fixed; 
            top:0; left:0; 
            width: 100%; height: 100%; 
            background: rgba(15, 23, 42, 0.4); 
            backdrop-filter: blur(6px);
            align-items: center; 
            justify-content: center; 
            z-index: 1000; 
            padding: 20px; 
        }

        .modal.active { display: flex; }

        .modal-content { 
            background: #FFFFFF; 
            border-radius: 24px; 
            width: 100%; 
            max-width: 380px; 
            padding: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.12); 
            max-height: 90vh; 
            overflow-y: auto; 
        }

        .modal-content h2 { 
            font-size: 18px; 
            font-weight: 700;
            margin-bottom: 18px; 
            text-align: center; 
            color: #1E293B; 
        }

        .input-group { margin-bottom: 14px; }
        .input-group label { font-size: 12px; font-weight: 600; color: #64748B; display: block; margin-bottom: 6px; }
        
        .input-group input, .input-group textarea { 
            width: 100%; 
            padding: 12px 14px; 
            border: 1.5px solid #E2E8F0; 
            border-radius: 12px; 
            font-size: 15px; 
            outline: none; 
            background: #F8FAFC;
            transition: border-color 0.2s;
        }

        .input-group input:focus, .input-group textarea:focus {
            border-color: #6366F1;
            background: #FFFFFF;
        }

        .radio-group { display: flex; gap: 20px; margin: 14px 0; justify-content: center; font-weight: 600; color: #475569; }

        .result-box { 
            background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 100%); 
            padding: 16px; 
            border-radius: 16px; 
            text-align: center; 
            font-weight: 700; 
            font-size: 20px; 
            color: #4338CA; 
            margin: 16px 0; 
        }

        .modal-buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }

        .btn { 
            padding: 12px 18px; 
            border-radius: 12px; 
            border: none; 
            font-size: 14px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.2s;
        }

        .btn-primary { background: #4F46E5; color: white; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25); }
        .btn-secondary { background: #F1F5F9; color: #475569; }
        .btn-danger { background: #EF4444; color: white; }

        .qr-img { display: block; margin: 15px auto; width: 180px; height: 180px; border-radius: 12px; }
        .bill-container { background: #F8FAFC; padding: 14px; border-radius: 16px; border: 1px solid #E2E8F0; margin-bottom: 15px; max-height: 250px; overflow-y: auto; }
    </style>
</head>
<body>

    <header>
        <h1>Tính Số Tiền</h1>
        <div class="header-actions">
            <button onclick="openReceiptModal()" title="Hóa đơn">🧾</button>
            <button onclick="openShareModal()" title="Chia sẻ">📤</button>
            <button onclick="openImportModal()" title="Nhập cấu hình">📥</button>
        </div>
    </header>

    <div class="grid" id="itemsGrid"></div>

    <button class="fab" onclick="openAddModal()">+</button>

    <!-- Modal Thêm Mặt Hàng -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <h2>Thêm mặt hàng mới</h2>
            <div class="input-group">
                <label>Tên mặt hàng</label>
                <input type="text" id="addName" placeholder="VD: Cam">
            </div>
            <div class="input-group">
                <label>Giá 1 Kg (VNĐ)</label>
                <input type="number" id="addPrice" placeholder="VD: 50000">
            </div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeModal('addModal')">Hủy</button>
                <button class="btn btn-primary" onclick="saveNewItem()">Tạo</button>
            </div>
        </div>
    </div>

    <!-- Modal Tính Tiền -->
    <div class="modal" id="calcModal">
        <div class="modal-content">
            <h2 id="calcTitle">Tính tiền</h2>
            <div class="input-group">
                <label>Số lượng</label>
                <input type="text" id="calcWeight" placeholder="VD: 3 hoặc 500" oninput="calculateTotal()">
            </div>
            <div class="radio-group">
                <label><input type="radio" name="unit" value="kg" checked onchange="calculateTotal()"> Kg</label>
                <label><input type="radio" name="unit" value="g" onchange="calculateTotal()"> Gam (g)</label>
            </div>
            <div class="result-box" id="calcResult">Thành tiền: 0 VNĐ</div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeModal('calcModal')">Đóng</button>
                <button class="btn btn-primary" onclick="addToBill()">Thêm vào hóa đơn</button>
            </div>
        </div>
    </div>

    <!-- Modal Hóa Đơn -->
    <div class="modal" id="receiptModal">
        <div class="modal-content">
            <h2>🧾 HÓA ĐƠN BÁN HÀNG</h2>
            <div class="bill-container" id="receiptContent">Chưa có món nào.</div>
            <div class="modal-buttons">
                <button class="btn btn-danger" onclick="clearBill()">Xóa / Tạo mới</button>
                <button class="btn btn-secondary" onclick="closeModal('receiptModal')">Đóng</button>
                <button class="btn btn-primary" onclick="shareBill()">Chia sẻ</button>
            </div>
        </div>
    </div>

    <!-- Modal Chia Sẻ QR -->
    <div class="modal" id="shareModal">
        <div class="modal-content" style="text-align: center;">
            <h2>📤 Quét mã QR cấu hình</h2>
            <img id="qrImage" class="qr-img" src="" alt="Mã QR">
            <button class="btn btn-primary" style="width: 100%; margin-bottom: 10px;" onclick="copyConfigCode()">📋 Sao chép mã cấu hình</button>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeModal('shareModal')">Đóng</button>
            </div>
        </div>
    </div>

    <!-- Modal Nhập Cấu Hình -->
    <div class="modal" id="importModal">
        <div class="modal-content">
            <h2>📥 Nhập cấu hình</h2>
            <div class="input-group">
                <label>Dán mã cấu hình (JSON)</label>
                <textarea id="importCode" rows="4" placeholder="Dán mã vào đây..."></textarea>
            </div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeModal('importModal')">Hủy</button>
                <button class="btn btn-primary" onclick="processImport()">Nạp cấu hình</button>
            </div>
        </div>
    </div>

    <script>
        let listItems = JSON.parse(localStorage.getItem('saved_data') || '[]');
        let historyList = [];
        let currentItem = null;
        let currentTotal = 0;

        function renderItems() {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = '';
            listItems.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openCalcModal(index);
                card.innerHTML = `
                    <button class="btn-delete" onclick="deleteItem(event, ${index})">✕</button>
                    <h3>${item.name}</h3>
                    <p>Giá: ${Number(item.price).toLocaleString('vi-VN')} đ/kg</p>
                `;
                grid.appendChild(card);
            });
        }

        function saveItems() {
            localStorage.setItem('saved_data', JSON.stringify(listItems));
            renderItems();
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function openAddModal() {
            document.getElementById('addName').value = '';
            document.getElementById('addPrice').value = '';
            openModal('addModal');
        }

        function saveNewItem() {
            const name = document.getElementById('addName').value.trim();
            const price = document.getElementById('addPrice').value.trim();
            if (name && price) {
                listItems.push({ name, price });
                saveItems();
                closeModal('addModal');
            } else {
                alert('Vui lòng nhập đầy đủ thông tin!');
            }
        }

        // Xóa mặt hàng chính có hỏi lại (Ảnh 1420)
        function deleteItem(e, index) {
            e.stopPropagation();
            const itemName = listItems[index].name;
            if (confirm(`Xóa mặt hàng\n\nBạn có chắc muốn xóa '${itemName}'?`)) {
                listItems.splice(index, 1);
                saveItems();
            }
        }

        function openCalcModal(index) {
            currentItem = listItems[index];
            document.getElementById('calcTitle').innerText = 'Tính tiền: ' + currentItem.name;
            document.getElementById('calcWeight').value = '';
            document.getElementById('calcResult').innerText = 'Thành tiền: 0 VNĐ';
            currentTotal = 0;
            openModal('calcModal');
        }

        function calculateTotal() {
            let input = document.getElementById('calcWeight').value.trim().replace(',', '.');
            const unit = document.querySelector('input[name="unit"]:checked').value;
            if (!input || isNaN(input)) {
                currentTotal = 0;
                document.getElementById('calcResult').innerText = 'Thành tiền: 0 VNĐ';
                return;
            }
            let val = parseFloat(input);
            let price = parseFloat(currentItem.price);
            currentTotal = unit === 'kg' ? val * price : (val / 1000) * price;
            document.getElementById('calcResult').innerText = 'Thành tiền: ' + Math.round(currentTotal).toLocaleString('vi-VN') + ' VNĐ';
        }

        function addToBill() {
            let rawInput = document.getElementById('calcWeight').value.trim();
            if (!rawInput || currentTotal <= 0) {
                alert('Vui lòng nhập số lượng hợp lệ!');
                return;
            }
            const unit = document.querySelector('input[name="unit"]:checked').value;
            historyList.push({
                name: currentItem.name,
                detail: `${rawInput} ${unit}`,
                total: currentTotal
            });
            alert(`Đã thêm ${currentItem.name} vào hóa đơn!`);
            closeModal('calcModal');
        }

        // Mở Hóa đơn có nút xóa từng món
        function openReceiptModal() {
            if (historyList.length === 0) {
                alert('Hóa đơn hiện tại đang trống!');
                return;
            }

            const container = document.getElementById('receiptContent');
            container.innerHTML = '';
            let grandTotal = 0;

            historyList.forEach((item, index) => {
                grandTotal += item.total;
                const row = document.createElement('div');
                row.style.cssText = 'display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; padding-bottom:8px; border-bottom:1px dashed #E2E8F0;';
                row.innerHTML = `
                    <div style="text-align: left;">
                        <strong style="color:#0F172A;">${index + 1}. ${item.name}</strong> <span style="color:#64748B; font-size:12px;">(${item.detail})</span><br>
                        <span style="color:#6366F1; font-weight:bold;">➔ ${Math.round(item.total).toLocaleString('vi-VN')} VNĐ</span>
                    </div>
                    <button onclick="deleteReceiptItem(${index})" style="background:#EF4444; color:white; border:none; padding:6px 12px; border-radius:8px; cursor:pointer; font-size:12px; font-weight:600;">Xóa</button>
                `;
                container.appendChild(row);
            });

            const totalDiv = document.createElement('div');
            totalDiv.style.cssText = 'font-weight:700; font-size:16px; margin-top:14px; text-align:right; color:#4338CA; border-top:2px solid #E2E8F0; padding-top:10px;';
            totalDiv.innerText = `TỔNG CỘNG: ${Math.round(grandTotal).toLocaleString('vi-VN')} VNĐ`;
            container.appendChild(totalDiv);

            openModal('receiptModal');
        }

        // Xóa 1 món trong Hóa đơn
        function deleteReceiptItem(index) {
            const itemName = historyList[index].name;
            if (confirm(`Xóa món khỏi hóa đơn\n\nBạn có chắc muốn xóa '${itemName}'?`)) {
                historyList.splice(index, 1);
                if (historyList.length === 0) {
                    closeModal('receiptModal');
                    alert('Hóa đơn hiện tại đã trống!');
                } else {
                    openReceiptModal();
                }
            }
        }

        // Xóa toàn bộ Hóa đơn (Ảnh 1421)
        function clearBill() {
            if (confirm("⚠️ Xác nhận xóa hóa đơn\n\nBạn có chắc chắn muốn xóa toàn bộ hóa đơn này để tạo mới không?")) {
                historyList = [];
                closeModal('receiptModal');
                alert('Đã xóa toàn bộ hóa đơn!');
            }
        }

        function shareBill() {
            if (historyList.length === 0) return;
            let text = "🧾 CHI TIẾT HÓA ĐƠN:\n\n";
            let grandTotal = 0;
            historyList.forEach((item, index) => {
                grandTotal += item.total;
                text += `${index + 1}. ${item.name} (${item.detail})\n   ➔ ${Math.round(item.total).toLocaleString('vi-VN')} VNĐ\n\n`;
            });
            text += `------------------------------\nTỔNG CỘNG: ${Math.round(grandTotal).toLocaleString('vi-VN')} VNĐ`;

            if (navigator.share) {
                navigator.share({ text: text });
            } else {
                navigator.clipboard.writeText(text);
                alert('Đã sao chép hóa đơn vào bộ nhớ tạm!');
            }
        }

        function openShareModal() {
            if (listItems.length === 0) return alert('Chưa có cấu hình nào để chia sẻ!');
            const jsonStr = JSON.stringify(listItems);
            document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(jsonStr)}`;
            openModal('shareModal');
        }

        function copyConfigCode() {
            navigator.clipboard.writeText(JSON.stringify(listItems));
            alert('Đã sao chép mã cấu hình!');
        }

        function openImportModal() {
            document.getElementById('importCode').value = '';
            openModal('importModal');
        }

        function processImport() {
            const code = document.getElementById('importCode').value.trim();
            if (!code) return alert('Vui lòng dán mã cấu hình!');
            try {
                const parsed = JSON.parse(code);
                if (Array.isArray(parsed)) {
                    listItems = parsed;
                    saveItems();
                    closeModal('importModal');
                    alert(`Đã nạp thành công ${listItems.length} mặt hàng!`);
                } else throw new Error();
            } catch (e) {
                alert('Mã cấu hình không hợp lệ!');
            }
        }

        renderItems();
    </script>
</body>
</html>
